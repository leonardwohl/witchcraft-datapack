services:
  minecraft:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "SNAPSHOT"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "testing"
      RCON_PORT: "25575"
      # Minimal server config for fast startup
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "1"
      ONLINE_MODE: "false"
    ports:
      - "25575:25575"
    volumes:
      - ./server-data:/data
      - ..:/data/world/datapacks/witchcraft:ro
    tmpfs:
      - /data/world/region
