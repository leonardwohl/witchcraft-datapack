name: Test Datapack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r tests/requirements.txt

      - run: python tests/validate_recipes.py

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Run integration test
        run: make test

  vanilla-drift:
    name: Vanilla Recipe Drift Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check recipe coverage against vanilla server JAR
        run: python scripts/extract_vanilla_recipes.py
