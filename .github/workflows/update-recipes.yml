name: Update Recipes from Vanilla

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "latest-release, latest-snapshot, or an exact version id (e.g. 26.4)"
        default: latest-release

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update for ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs check both channels; snapshot PRs are drafts since their
        # recipes can reference items that don't exist in the current release.
        version: ${{ github.event_name == 'schedule' && fromJSON('["latest-release", "latest-snapshot"]') || fromJSON(format('["{0}"]', inputs.version)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract vanilla recipes and regenerate overrides
        id: extract
        run: |
          python scripts/extract_vanilla_recipes.py --version "${{ matrix.version }}" --update | tee extract.log
          echo "mc_version=$(sed -n 's/^Server version \([^,]*\),.*/\1/p' extract.log)" >> "$GITHUB_OUTPUT"
          rm extract.log

      - name: Show changes
        run: |
          git status --short
          echo "Recipe count: $(ls data/witchcraft/recipe/*.json | wc -l)"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/minecraft-${{ matrix.version }}
          title: "Update for Minecraft ${{ steps.extract.outputs.mc_version }}"
          commit-message: "Update recipes and pack format for Minecraft ${{ steps.extract.outputs.mc_version }} (auto-generated)"
          draft: ${{ matrix.version != 'latest-release' }}
          add-paths: |
            data/witchcraft/recipe/
            pack.mcmeta
            .github/modrinth-game-versions.txt
          body: |
            Generated by `scripts/extract_vanilla_recipes.py --version ${{ steps.extract.outputs.mc_version }} --update`.

            Regenerates the brewing recipe overrides from the vanilla server JAR, raises `pack.mcmeta` `max_format` if the data pack format moved, and adds the version to the Modrinth game versions list.
