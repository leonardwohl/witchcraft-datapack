name: Update Recipes from Vanilla

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Extract and Update Vanilla Recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract vanilla recipes and regenerate overrides
        run: python scripts/extract_vanilla_recipes.py --update

      - name: Show changes
        run: |
          git diff --stat
          echo "---"
          echo "Recipe count:"
          ls data/minecraft/recipe/*.json | wc -l

      - name: Commit and push
        run: |
          git config user.name "leonardwohl"
          git config user.email "leonard.wohl@gmail.com"
          git add data/minecraft/recipe/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update vanilla recipe overrides from server JAR (auto-generated)"
          git push
